zerops:
  # ── Dashboard (Next.js standalone) ──
  - setup: web
    build:
      base: nodejs@22
      os: ubuntu
      envVariables:
        NEXT_PUBLIC_WORKER_URL: ${NEXT_PUBLIC_WORKER_URL}
      buildCommands:
        - cd apps/web && npm install && npm run build
      cache:
        - apps/web/node_modules
        - apps/web/.next/cache
      deployFiles:
        - apps/web/.next/standalone/~
        - apps/web/.next/static/~.next/static
        - apps/web/public/~public
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        HOSTNAME: 0.0.0.0
      start: node apps/web/server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /
        failureTimeout: 60
        disconnectTimeout: 30
        recoveryTimeout: 30
        execPeriod: 15

  # ── Worker pipeline (Fastify on :8787, SQLite) ──
  - setup: worker
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - cd apps/worker && npm install
      cache:
        - apps/worker/node_modules
      deployFiles:
        - apps/worker/src/~src
        - apps/worker/package.json
        - apps/worker/package-lock.json
        - apps/worker/tsconfig.json
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 8787
          httpSupport: true
      initCommands:
        - npm install
      envVariables:
        BRIGHT_DATA_API_KEY: ${BRIGHT_DATA_API_KEY}
        COLLECTOR_NEWEGG: ${COLLECTOR_NEWEGG}
        COLLECTOR_BHPHOTO: ${COLLECTOR_BHPHOTO}
        COLLECTOR_MINDFACTORY: ${COLLECTOR_MINDFACTORY}
        COLLECTOR_CHAOS: ${COLLECTOR_CHAOS}
        COLLECTOR_TREEBO: ${COLLECTOR_TREEBO}
        COLLECTOR_FABHOTELS: ${COLLECTOR_FABHOTELS}
        CHAOS_STORE_URL: https://hydra-chaos-store.vercel.app/
        SCHEDULER: "on"
        CHAOS_TEST_ENABLED: "on"
        WORKER_PORT: "8787"
      start: npx tsx src/index.ts
      healthCheck:
        httpGet:
          port: 8787
          path: /api/health
        failureTimeout: 60
        disconnectTimeout: 30
        recoveryTimeout: 60
        execPeriod: 15
