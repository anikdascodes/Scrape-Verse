zerops:
  # ── Dashboard (Next.js standalone) ──
  - setup: web
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - cd apps/web && npm install && npm run build
      cache:
        - apps/web/node_modules
        - apps/web/.next/cache
      deployFiles:
        - apps/web/.next/standalone
        - apps/web/.next/static
        - apps/web/public
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        HOSTNAME: 0.0.0.0
      start: node apps/web/.next/standalone/apps/web/server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /
        failureTimeout: "60s"
        disconnectTimeout: "30s"
        recoveryTimeout: "30s"
        execPeriod: "15s"

  # ── Worker pipeline (Fastify on :8787, SQLite) ──
  - setup: worker
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - cd apps/worker && npm install && npx tsc
      cache:
        - apps/worker/node_modules
      deployFiles:
        - apps/worker/dist
        - apps/worker/package.json
        - apps/worker/package-lock.json
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 8787
          httpSupport: true
      initCommands:
        - cd apps/worker && npm install --omit=dev
        - mkdir -p data
      envVariables:
        BRIGHT_DATA_API_KEY: ${BRIGHT_DATA_API_KEY}
        COLLECTOR_NEWEGG: ${COLLECTOR_NEWEGG}
        COLLECTOR_BHPHOTO: ${COLLECTOR_BHPHOTO}
        COLLECTOR_MINDFACTORY: ${COLLECTOR_MINDFACTORY}
        COLLECTOR_CHAOS: ${COLLECTOR_CHAOS}
        COLLECTOR_TREEBO: ${COLLECTOR_TREEBO}
        COLLECTOR_FABHOTELS: ${COLLECTOR_FABHOTELS}
        CHAOS_STORE_URL: https://hydra-chaos-store.vercel.app/
        SCHEDULER: "on"
        CHAOS_TEST_ENABLED: "on"
        WORKER_PORT: "8787"
      start: node apps/worker/dist/index.js
      healthCheck:
        httpGet:
          port: 8787
          path: /api/health
        failureTimeout: "60s"
        disconnectTimeout: "30s"
        recoveryTimeout: "60s"
        execPeriod: "15s"
